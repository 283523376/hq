    saasMode: 
    # 签名密钥串(前后端要一致，正式发布请自行修改)
    signatureSecret: dd05f1c54d63749eda95f9fa6d49v442a
    ai:
      # OpenAI 兼容 base 地址（必填）
      base-url: https://api.deepseek.com
      # API Key（必填，留空则 AI 不可用）
      api-key: 
      # 模型名
      model: deepseek-v4-pro
      #确定性输出，默认temperature=0
      temperature: 0
