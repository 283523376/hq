# ============================================================================
# 永鑫WMS 外部系统对接占位（YX-WMS-RK-002 生产入库）
# 说明：
#   1) 地址为空时各网关走「模拟受理/模拟成功」，保证无外部系统时流程可闭环演示；
#   2) 拿到 MES/ERP 地址、报文最终版与测试账号后，只改本段配置，不改业务代码；
#   3) 开发令牌仅用于本机联调，生产环境必须替换。
# ============================================================================
wms:
  transfer:
    # CK-004 库存调拨：跨仓在途暂存库位（必须在调入仓内）；为空时建跨仓单会被拒绝
    transit-location-id: "${WMS_TRANSFER_TRANSIT_LOCATION_ID:}"
    # 是否启用「出发/到达」两段式确认（false = 出发即落暂存库位）
    enable-transit: "${WMS_TRANSFER_ENABLE_TRANSIT:true}"
    # 跨库调拨开关：业务已确认跨库由金蝶 ERP 实现，WMS 只做同库区移库（默认 false）
    enable-cross-warehouse: "${WMS_TRANSFER_ENABLE_CROSS:false}"
    # 【仅测试】将金蝶调拨单状态模拟为指定值（A/B/C/D），用于验证「C 才算完成」；生产留空
    simulate-erp-status: "${WMS_TRANSFER_SIMULATE_ERP_STATUS:}"
    # 金蝶调拨单库存组织编码
    org-code: "${KINGDEE_TRANSFER_ORG_CODE:101}"
  sync:
    mes:
      # MES 工单查询地址（占位）；未配置时只查本地 wms_work_order
      work-order-url: ""
      # MES 测试账号（占位）
      username: ""
      password: ""
      # MES 推送工单到 WMS 的令牌（开发占位，生产必须替换）
      push-token: "dev-mes-token"
      # 生产入库同步 MES 地址（占位）
      production-inbound-url: ""
      # 出库同步 MES 地址（占位）；未配置且金蝶未启用时走 mock
      outbound-url: ""
    rms:
      # 米塔 RMS 根地址（占位），例如 http://192.168.x.x:8080；未配置走模拟受理
      url: ""
      # 入库工作站编码（占位）
      station-code: ""
      warehouse: "MITA"
      priority: 1
      # 连接/读取超时（毫秒）：需求方口径 30 秒
      timeout-ms: 30000
      # RMS 回调令牌（开发占位，生产必须替换）
      callback-token: "dev-rms-token"
      # 出库工作站编码，逗号分隔（如 OUT_01,OUT_02）；为空则由 RMS 决定
      outbound-stations: ""
      # 出库任务优先级 1~5
      outbound-priority: 1
      # CK-004 调拨：同仓搬运默认目标区域（米塔 zoneCode）；调拨不要求精准到库位
      transfer-default-zone: "${WMS_RMS_TRANSFER_DEFAULT_ZONE:PRE_ORDER}"
    wcs:
      # 堆垛机 WCS 入库下发地址（占位，协议待对方提供）
      inbound-url: ""
      # 堆垛机 WCS 任务取消地址（占位）
      cancel-url: ""
      # 堆垛机 WCS 出库下发地址（占位）
      outbound-url: ""
      # 堆垛机 WCS 出库任务取消地址（占位）
      cancel-outbound-url: ""
      username: ""
      password: ""
      # WCS 回执令牌（开发占位，生产必须替换）
      callback-token: "dev-wcs-token"
    erp:
      # 生产入库同步 ERP 地址（占位）
      production-inbound-url: ""
      username: ""
      password: ""
      # 金蝶云星空第三方系统登录授权（LoginByAppSecret）
      # 凭据只从环境变量读取，禁止写入仓库；启动前设置：
      #   KINGDEE_ERP_BASE_URL / KINGDEE_ERP_ACCT_ID / KINGDEE_ERP_USERNAME
      #   KINGDEE_ERP_APP_ID / KINGDEE_ERP_APP_SECRET
      kingdee:
        # 启用后 ERP 目标改为 PRD_INSTOCK Save/Submit（未启用时走通用 HTTP 地址/模拟）
        enabled: "${KINGDEE_ERP_ENABLED:false}"
        base-url: "${KINGDEE_ERP_BASE_URL:}"
        acct-id: "${KINGDEE_ERP_ACCT_ID:}"
        username: "${KINGDEE_ERP_USERNAME:}"
        app-id: "${KINGDEE_ERP_APP_ID:}"
        app-secret: "${KINGDEE_ERP_APP_SECRET:}"
        lcid: 2052
        # 仅测试环境可显式允许 HTTP；生产必须 HTTPS（默认 false）
        allow-http: "${KINGDEE_ERP_ALLOW_HTTP:false}"
        timeout-ms: 30000
        # 以下默认值来自测试环境实测（PRD_INSTOCK 样本），生产按金蝶顾问值覆盖
        # ORG_Organizations.FOrgID（测试环境：101 宜昌永鑫精工科技股份有限公司）
        default-org-id: "209624"
        # ORG_Organizations.FNumber
        default-org-number: "101"
        # BOS_BillType.FNumber（测试环境：SCRKD01_SYS 汇报入库）
        bill-type: "SCRKD01_SYS"
        owner-type: "BD_OwnerOrg"
        owner-id: "209624"
        keeper-type: "BD_KeeperOrg"
        keeper-id: "209624"
        # BD_StockStatus.FNumber（测试环境：KCZT01_SYS 可用）
        stock-status-id: "KCZT01_SYS"
        in-stock-type: "1"
        # 测试组织 101 下没有 02.002/02.001；以下为 101 的仓编码（待金蝶顾问确认生产用仓）
        stock-code:
          stereo: "D.02"     # PCB呆滞半成品专仓（暂用，待确认）
          agile: "D.01"      # PCB呆滞成品专仓（暂用，待确认）
          scrap: "F.03"      # 非标一部刀具废品仓（暂用，待确认）
        # 仓库是组织级基础资料：按生产订单组织覆盖仓库编码（键=组织编码），命中优先于上面通用值
        stock-code-by-org:
          "100":             # 江西兆鑫（历史生产订单都在 100）
            stereo: "02.002" # 自制半成品仓（启用仓位管理，回写需带 FStockLocId 或换仓，见 spec）
            agile: "02.001"  # 产成品仓（同上，实测报「仓位不能为空」）
          "101":             # 宜昌永鑫（新造测试数据默认组织；以下仓库均未启用仓位）
            stereo: "D.02"
            agile: "D.01"
            # CK-004 调拨按 WMS 库区编码取值（调拨单只到库区级）
            LB: "D.02"      # 半成品立库
            MJ: "D.01"      # 成品敏捷仓
        # 启用仓位管理的仓库：仓库编码 → 仓位编号（BD_FLEXVALUES 分录编号），回写时解析为内码传 FStockLocId
        stock-loc:
          "02.001": "01"     # 产成品仓-仓位A
          "02.002": "01"     # 自制半成品仓-仓位A
        # WMS 物料编码 → 金蝶物料编码（测试环境样例映射，生产按主数据映射表维护）
        material-map:
          PBC001: "WA.2206.2201.02000430.A003"
          FG001: "WA.2205.2200.03000550.B003"
        # WMS 物料编码 → WMS 产品类型（半成品/成品）。必须按物料配置：
        # 金蝶 FProductType 是「主产品/联产品/副产品」，不能用来区分半成品/成品。
        material-product-type:
          PBC001: "半成品"
          FG001: "成品"
        # 金蝶 FDocumentStatus → WMS 工单状态
        status-map:
          "A": "待生产"
          "B": "待生产"
          "C": "生产中"
        # ---- CK-001/CK-002 出库回写（单据类型均已实测存在） ----
        pick-bill-type: "${KINGDEE_PICK_BILL_TYPE:SCLLD01_SYS}"
        sale-order-bill-type: "${KINGDEE_SALE_ORDER_BILL_TYPE:XSDD01_SYS}"
        out-stock-bill-type: "${KINGDEE_OUT_STOCK_BILL_TYPE:XSCKD01_SYS}"
        sale-org-id: "${KINGDEE_SALE_ORG_ID:209624}"
        sale-org-number: "${KINGDEE_SALE_ORG_NUMBER:101}"
        # 测试环境 BD_Saler 样例（李传东）；生产按实际业务员覆盖
        saler-id: "${KINGDEE_SALER_ID:2040411001_GW000005_1}"
        settle-currency: "${KINGDEE_SETTLE_CURRENCY:PRE001}"
        # 测试环境 BD_Department / BD_Empinfo 样例；生产按实际发货部门/仓管员覆盖
        delivery-dept-id: "${KINGDEE_DELIVERY_DEPT_ID:201012}"
        stocker-id: "${KINGDEE_STOCKER_ID:1040401001}"
        # CK-004 库存调拨：标准直接调拨单 / 同组织调拨 / 普通方向
        transfer-bill-type: "${KINGDEE_TRANSFER_BILL_TYPE:ZJDB01_SYS}"
        transfer-biz-type: "${KINGDEE_TRANSFER_BIZ_TYPE:InnerOrgTransfer}"
        transfer-direct: "${KINGDEE_TRANSFER_DIRECT:GENERAL}"
        # 调拨单仓管员编码（BD_WAREHOUSEWORKERS，非员工编码；必须对组织 101 启用）
        transfer-stocker-number: "${KINGDEE_STOCKER_NUMBER:0050}"
        # 审批（B）超时告警阈值（小时），0 = 不告警
        transfer-approval-timeout-hours: "${KINGDEE_TRANSFER_APPROVAL_TIMEOUT_HOURS:24}"
    # 同步上级 WMS 地址（占位）
    wms:
      production-inbound-url: ""
